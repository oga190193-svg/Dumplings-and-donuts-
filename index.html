<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zalabia & Donuts | منيو وطلب أونلاين</title>
<meta name="theme-color" content="#d4145a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#dc1a5c;--dk:#9c0a43;--dk2:#6f0731;--y:#ffd51f;--y2:#ffe980;--tx:#fff;--mut:#ffd3e2;--ok:#25d366;--line:#ffffff33;--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:128px;scroll-padding-top:calc(128px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--dk)}
button,input,textarea,select{font-family:inherit;color:inherit}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 100% 0,#b30f4c 0 170px,transparent 171px),radial-gradient(circle at 0 100%,#c4135a 0 150px,transparent 151px)}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.hero{text-align:center;padding:30px 18px 22px}
.logo{width:150px;height:auto;filter:drop-shadow(0 8px 0 #6f073155);animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.hero h1{font-family:'Lalezar',sans-serif;font-weight:400;font-size:clamp(40px,11vw,64px);line-height:1.1;color:var(--y);text-shadow:3px 3px 0 var(--dk2);margin-top:6px;direction:ltr}
.tag{display:inline-block;margin-top:10px;background:var(--dk);border:2px solid var(--y);color:var(--y);padding:3px 18px;border-radius:8px;font-weight:700;font-size:15px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--dk);border-bottom:2px solid var(--y);padding:10px 12px 8px}
.search{display:flex;align-items:center;gap:8px;background:#ffffff1f;border:1px solid var(--line);border-radius:14px;padding:0 12px;max-width:760px;margin:0 auto 8px}
.search input{flex:1;background:none;border:0;outline:0;padding:10px 0;font-size:15px}
.search input::placeholder{color:var(--mut)}
.chips{overscroll-behavior-x:contain;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:900px;margin:0 auto;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 16px;border-radius:99px;background:#ffffff1f;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--tx);transition:.2s}
.chip.on{background:var(--y);color:var(--dk2);border-color:var(--y)}
main{max-width:900px;margin:0 auto;padding:6px 14px}
.sec{margin-top:28px}
.rb{display:inline-block;background:var(--y);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);font-weight:400}
.rb span{display:block;margin:3px;padding:2px 34px;background:var(--dk);color:var(--y);font-family:'Lalezar',sans-serif;font-size:26px;line-height:1.5;direction:ltr;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.sub{color:var(--mut);font-size:14px;margin:6px 4px 0}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.item{display:flex;flex-direction:column;gap:10px;background:var(--dk);border:2px solid #ffd51f55;border-radius:var(--r);padding:12px 14px}
.item h3{font-family:'Lalezar',sans-serif;font-weight:400;font-size:21px;line-height:1.3}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-family:'Lalezar',sans-serif;font-size:24px;color:var(--y)}
.price small{font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;color:var(--mut);margin-right:4px}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{flex:1;min-width:56px;background:var(--y);color:var(--dk2);border-radius:12px;padding:6px 6px;font-weight:900;font-size:15px;line-height:1.3;box-shadow:0 3px 0 #b58f00}
.op i{display:block;font-style:normal;font-weight:700;font-size:12px}
.op:active,.add:active{transform:translateY(2px);box-shadow:none}
.add{background:var(--y);color:var(--dk2);font-weight:900;border-radius:12px;padding:7px 18px;font-size:15px;box-shadow:0 3px 0 #b58f00}
.qty{display:flex;align-items:center;background:#0004;border:1px solid var(--y);border-radius:12px;overflow:hidden}
.qty button{width:34px;height:34px;font-size:20px;font-weight:700;color:var(--y)}
.qty b{min-width:26px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:40px 0;display:none}
footer{max-width:900px;margin:34px auto 0;padding:24px 16px;text-align:center;border-top:2px dashed var(--line);color:var(--mut);font-size:14px}
footer h4{font-family:'Lalezar',sans-serif;font-weight:400;font-size:26px;color:var(--y);direction:ltr}
.fl a{display:inline-block;margin-top:8px;background:var(--dk);border:2px solid var(--y);color:var(--y);text-decoration:none;padding:7px 18px;border-radius:12px;font-weight:700;direction:ltr}
.dev{margin:26px auto 0;max-width:340px;padding:22px 16px;border-radius:var(--r);background:var(--dk);border:2px solid var(--y);box-shadow:6px 6px 0 var(--dk2)}
.dev-name{font-family:'Lalezar',sans-serif;font-size:30px;color:var(--y);letter-spacing:.5px;line-height:1.2}
.dev-role{margin-top:4px;font-size:17px;font-weight:600;color:var(--tx)}
.dev-wa{display:block;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);font-weight:900;font-size:17px;color:var(--y);text-decoration:none}
.bar{position:fixed;inset:auto 0 0 0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(120%);transition:.3s}
.bar.show{transform:none}
.bar button{display:flex;width:100%;max-width:560px;margin:0 auto;align-items:center;justify-content:space-between;background:var(--y);color:var(--dk2);border-radius:16px;padding:13px 18px;font-weight:900;font-size:17px;box-shadow:0 5px 0 #b58f00,0 12px 26px #0006}
.bar .cnt{background:var(--dk2);color:var(--y);border-radius:99px;min-width:28px;height:28px;display:inline-grid;place-items:center;font-size:14px;padding:0 6px}
.ov{position:fixed;inset:0;background:#000a;z-index:50;opacity:0;pointer-events:none;transition:.25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;inset:auto 0 0 0;max-height:92vh;background:var(--dk2);border-radius:24px 24px 0 0;border:2px solid var(--y);border-bottom:0;display:flex;flex-direction:column;transform:translateY(105%);transition:.3s;max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.sh h3{font-family:'Lalezar',sans-serif;font-weight:400;font-size:26px;color:var(--y)}
.x{width:36px;height:36px;border-radius:50%;background:#ffffff22;font-size:18px}
.sb{overflow-y:auto;padding:0 18px 12px;flex:1}
.ln{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ln .n{flex:1;font-size:14px;font-weight:600;line-height:1.4}
.ln .n small{display:block;color:var(--mut);font-weight:400}
.ln .t{font-weight:700;color:var(--y);min-width:64px;text-align:left;font-size:14px}
.f{margin-top:14px;display:grid;gap:10px}
.f label{font-size:13px;color:var(--mut);font-weight:600}
.f input,.f textarea,.f select{width:100%;background:#ffffff1a;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:0;margin-top:3px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--y)}
.f select option{background:#6f0731;color:#fff}
.f .bad{border-color:#ffe980;background:#ff000033}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode button{padding:10px 6px;border-radius:12px;background:#ffffff1a;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mut)}
.mode button.on{border-color:var(--y);color:var(--dk2);background:var(--y)}
.sf{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--dk2)}
.subtot{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);margin-bottom:4px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:900;margin-bottom:10px}
.tot span:last-child{color:var(--y)}
.wa{text-decoration:none;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ok);color:#052e12;border-radius:14px;padding:14px;font-size:17px;font-weight:900}
.wa:active{transform:scale(.98)}
.clr{display:block;margin:10px auto 0;color:var(--mut);font-size:13px;text-decoration:underline}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-200%);background:var(--dk2);border:2px solid var(--y);color:#fff;padding:8px 18px;border-radius:99px;z-index:80;font-size:14px;font-weight:600;transition:.3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.noc{text-align:center;color:var(--mut);padding:30px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

[['قهوة تركي',25],['اسبريسو',40],['اسبريسو دابل',60],['كابتشينو',50],['هوت شوكليت',50],['كلاسيك ايس كوفي',50],['قهوة فرنساوي',40],['كارميل ايس كوفي',50],['دارك ايس كوفي',50],['ايس سبنش لاتية',100],['ايس موكا',90]].forEach(([n,p])=>mk('cof',n,[['',p]]));
const $=s=>document.querySelector(s);
let cart={},mode='توصيل';
try{cart=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){cart={}}
const money=n=>n.toLocaleString('ar-EG')+' جنيه';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const one=it=>it.o.length===1;
$('#zn').innerHTML=ZONES.map(z=>`<option value="${z.id}">${z.id?`${z.name} (+${z.fee} جنيه)`:z.name}</option>`).join('');
const getZone=()=>ZONES.find(z=>z.id===$('#zn').value)||ZONES[0];
const delivFee=()=>mode==='توصيل'?getZone().fee:0;
function card(it){
  const c=CATS.find(x=>x.id===it.c);
  const body=one(it)
    ?`<div class="row"><span class="price">${it.o[0][1]}<small>جنيه</small></span><span data-act="${it.id}"></span></div>`
    :`<div class="ops">${it.o.map((o,i)=>`<button class="op" data-add="${it.id}" data-i="${i}">${o[0]}<i>${o[1]} ج</i></button>`).join('')}</div>`;
  return `<article class="item" data-name="${esc(it.n+' '+c.t+' '+c.en)}"><h3>${esc(it.n)}</h3>${body}</article>`;
}
function renderMenu(){
  $('#menu').innerHTML=CATS.map(c=>`<section class="sec" id="${c.id}"><h2 class="rb"><span>${c.en}</span></h2><div class="sub">${c.e} ${c.t}${c.s?' - '+c.s:''}</div><div class="grid">${ITEMS.filter(i=>i.c===c.id).map(card).join('')}</div></section>`).join('');
  $('#chips').innerHTML=CATS.map((c,i)=>`<button class="chip${i?'':' on'}" data-go="${c.id}">${c.e} ${c.t}</button>`).join('');
}
function refreshAct(it){
  const el=document.querySelector(`[data-act="${it.id}"]`);if(!el)return;
  const q=(cart[it.id]||{}).q||0;
  el.innerHTML=q?`<div class="qty"><button data-dec="${it.id}" aria-label="نقص">−</button><b>${q}</b><button data-inc="${it.id}" aria-label="زيادة">+</button></div>`:`<button class="add" data-add="${it.id}">+ أضف</button>`;
}
function add(id,i){
  const it=ITEMS.find(x=>x.id===id);if(!it)return;
  const o=it.o[i],c=CATS.find(x=>x.id===it.c);
  const key=one(it)?id:id+'_'+i;
  const name=`${c.t} ${it.n}${o[0]?` (${o[0]})`:''}`;
  (cart[key]=cart[key]||{n:name,p:o[1],q:0,id}).q++;
  after(id);toast(`✅ تمت إضافة ${name}`);
}
function chg(key,d){
  if(!cart[key])return;cart[key].q+=d;const id=cart[key].id;
  if(cart[key].q<=0)delete cart[key];
  after(id);
}
function after(id){save();const it=ITEMS.find(x=>x.id===id);if(it&&one(it))refreshAct(it);paint()}
const subTotal=()=>Object.values(cart).reduce((s,l)=>s+l.p*l.q,0);
const grandTotal=()=>subTotal()+delivFee();
const count=()=>Object.values(cart).reduce((s,l)=>s+l.q,0);
function paint(){
  const n=count(),z=getZone();
  $('#cnt').textContent=n.toLocaleString('ar-EG');
  $('#barTot').textContent=money(subTotal());
  $('#delivRow').style.display=mode==='توصيل'?'flex':'none';
  $('#delivZoneLbl').textContent=z.id?z.name:'اختر المنطقة';
  $('#delivFeeLbl').textContent=money(z.fee);
  $('#tot').textContent=money(grandTotal());
  $('#bar').classList.toggle('show',n>0&&!$('#sheet').classList.contains('show'));
  const ks=Object.keys(cart);
  $('#lines').innerHTML=ks.length?ks.map(k=>{const l=cart[k];return `<div class="ln"><div class="n">${esc(l.n)}<small>${l.p} جنيه للواحد</small></div><div class="qty"><button data-dec="${k}">−</button><b>${l.q}</b><button data-inc="${k}">+</button></div><div class="t">${money(l.p*l.q)}</div></div>`}).join(''):'<div class="noc">🛒 السلة فاضية، اختار من المنيو</div>';
  $('#form').style.display=$('.sf').style.display=ks.length?'':'none';
  if(!ks.length&&$('#sheet').classList.contains('show'))setTimeout(()=>openSheet(false),0);
}
function openSheet(o){
  $('#sheet').classList.toggle('show',o);$('#ov').classList.toggle('show',o);
  document.body.style.overflow=o?'hidden':'';
  if(!o)paint();else $('#bar').classList.remove('show');
}
try{const f=JSON.parse(localStorage.getItem(KEYF)||'{}');['nm','ph','ad','zn'].forEach(i=>{if(f[i])$('#'+i).value=f[i]});if(f.m)mode=f.m}catch(e){}
function syncMode(){
  document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  $('#adW').style.display=$('#znW').style.display=mode==='توصيل'?'':'none';
  paint();
}
function saveForm(){try{localStorage.setItem(KEYF,JSON.stringify({nm:$('#nm').value,ph:$('#ph').value,ad:$('#ad').value,zn:$('#zn').value,m:mode}))}catch(e){}}
function send(){
  if(!count())return null;
  const nm=$('#nm').value.trim(),ph=$('#ph').value.trim(),ad=$('#ad').value.trim(),nt=$('#nt').value.trim(),z=getZone();
  let bad=false;
  [['nm',!nm],['zn',mode==='توصيل'&&!z.id],['ad',mode==='توصيل'&&!ad]].forEach(([i,b])=>{$('#'+i).classList.toggle('bad',b);if(b)bad=true});
  if(bad){toast('⚠️ من فضلك أكمل البيانات المطلوبة');return null}
  if(ph&&!/^[0-9+\u0660-\u0669\s-]{8,16}$/.test(ph)){$('#ph').classList.add('bad');toast('⚠️ رقم الموبايل غير صحيح');return null}
  saveForm();
  const lines=Object.values(cart).map((l,i)=>`${i+1}) ${l.n} × ${l.q} = ${l.p*l.q} جنيه`).join('\n');
  const locLine=mode==='توصيل'?`\n🗺️ المنطقة: ${z.name}\n📍 العنوان: ${ad}`:'';
  const modeIcon=mode==='توصيل'?'🛵':'🏪';
  const feeText=mode==='توصيل'?`\n📦 قيمة الطلبات: ${subTotal()} جنيه\n🛵 خدمة التوصيل (${z.name}): ${z.fee} جنيه`:'';
  const msg=`🍩 *طلب جديد - ${SHOP}*\n━━━━━━━━━━━━\n${lines}\n━━━━━━━━━━━━${feeText}\n💰 *الإجمالي المطلوب: ${grandTotal()} جنيه*\n\n👤 الاسم: ${nm}${ph?`\n📞 الموبايل: ${ph}`:''}\n${modeIcon} نوع الطلب: ${mode}${locLine}${nt?`\n📝 ملاحظات: ${nt}`:''}`;
  try{localStorage.setItem(KEYP,JSON.stringify({cart,t:Date.now()}))}catch(e){}
  return `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]');if(!t)return;
  const d=t.dataset;
  if(d.add)add(d.add,d.i?+d.i:0);
  else if(d.inc)chg(d.inc,1);
  else if(d.dec)chg(d.dec,-1);
  else if(d.undo!==undefined)undo();
  else if(d.go){const el=document.getElementById(d.go),h=$('.sticky').offsetHeight,ins=parseFloat(getComputedStyle(document.documentElement).paddingTop)||0;window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-h-ins-8,behavior:'auto'})}
  else if(d.m){mode=d.m;syncMode();saveForm()}
});
$('#openCart').onclick=()=>openSheet(true);
$('#close').onclick=$('#ov').onclick=()=>openSheet(false);
$('#send').addEventListener('click',e=>{const u=send();if(!u)e.preventDefault();else e.currentTarget.href=u});
$('#zn').addEventListener('change',e=>{e.target.classList.remove('bad');saveForm();paint()});
$('#clear').onclick=()=>{if(confirm('تفريغ السلة بالكامل؟')){cart={};save();ITEMS.forEach(refreshAct);paint()}};
['nm','ph','ad'].forEach(i=>$('#'+i).addEventListener('input',e=>{e.target.classList.remove('bad');saveForm()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')openSheet(false)});
$('#q').addEventListener('input',e=>{
  const nz=s=>s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').toLowerCase();
  const v=nz(e.target.value.trim());let any=false;
  document.querySelectorAll('.item').forEach(el=>{const s=!v||nz(el.dataset.name).includes(v);el.style.display=s?'':'none';if(s)any=true});
  document.querySelectorAll('.sec').forEach(s=>s.style.display=[...s.querySelectorAll('.item')].some(i=>i.style.display!=='none')?'':'none');
  $('#empty').style.display=any?'none':'block';
});
const io=new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting)document.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.go===en.target.id;c.classList.toggle('on',on);if(on){const bx=$('#chips'),cr=c.getBoundingClientRect(),br=bx.getBoundingClientRect();bx.scrollLeft+=(cr.left+cr.width/2)-(br.left+br.width/2)}})
}),{rootMargin:'-140px 0px -65% 0px'});
let tt;function toast(m,ms=1800,html){const t=$('#toast');if(html)t.innerHTML=m;else t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms)}
renderMenu();
Object.keys(cart).forEach(k=>{if(!ITEMS.some(i=>i.id===(cart[k].id||k)))delete cart[k]});
ITEMS.filter(one).forEach(refreshAct);
document.querySelectorAll('.sec').forEach(s=>io.observe(s));
syncMode();paint();
let backup=null;
function finalize(){
  let p=null;try{p=JSON.parse(localStorage.getItem(KEYP)||'null')}catch(e){}
  if(!p||Date.now()-p.t<1500)return;
  try{localStorage.removeItem(KEYP)}catch(e){}
  backup=p.cart;cart={};save();$('#nt').value='';
  ITEMS.forEach(refreshAct);openSheet(false);paint();
  toast('✅ تم إرسال طلبك، شكراً لك! <button data-undo style="color:var(--y);font-weight:900;margin-right:10px;text-decoration:underline">تراجع</button>',9000,true);
}
function undo(){if(!backup)return;cart=backup;backup=null;save();ITEMS.forEach(refreshAct);paint();toast('↩️ تم استرجاع طلبك')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)finalize()});
window.addEventListener('pageshow',finalize);
window.addEventListener('focus',finalize);
finalize();
</script>
</body>
</html>
